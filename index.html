const scores = { 沈宁:0, 夏晴:0, 小安:0 };

const FLOW = [
  { type:"text", tag:"9月 · 刚到大四", lines:[
    "开学第一周，我就明白了：前面没有台阶了。",
    "“考上就好了”——这句话我听了二十年。考初中，考上就好了；考高中，考上就好了；高考那年，全家围着我，还是这一句。",
    "我一路踩，一路不敢抬头，也不敢低头。现在，我站到最后一级。抬头，前面是空的。",
  ]},
  { type:"text", tag:"", lines:[
    "我不是怕找不到工作。我是怕看清，自己从来没想过，到底想要什么。",
    "大学四年，我也不是没试过。加过社团，退了；谈过一段，散了；实习做过两份，都不了了之。别人问我喜欢什么，我支吾半天，说不出个所以然。",
  ]},
  { type:"choice", p:"秋招网申通道开了。光标在投递页一闪一闪。",
    o:[["海投，有 offer 再说","沈宁-","投了三十几家，像把简历一把一把扔进海里。"],["挑了几家，改来改去没敢提交","-","改到半夜，最后一份都没投出去。"],["关了页面，去翻“我适合做什么”的书","夏晴-","翻了一下午，越翻越迷茫。"]]},
  { type:"choice", p:"群面，一张圆桌坐满人。别人从实习说到项目说到人生规划，你张了两次嘴，没插上。",
    o:[["硬抢过话头，说了句自己都听不清的话","小安-","说完，四周静了一秒，你的脸烫起来。"],["全程点头，散场落荒而逃","-","走出大楼，你才敢喘口气。"],["最后走，拦住面试官问“我差在哪”","小安+","面试官愣了下，认真跟你说了三分钟。"]]},

  { type:"text", tag:"10月 · 沈宁", lines:[
    "沈宁是我认识很多年的一个姐姐。",
    "我大一那年，她刚工作，在会计师事务所。我们是朋友的朋友，一次饭局上认识。她话不多，安静地听，安静地笑。那顿饭我全程拘谨，只有跟她说话时，不用费劲找话题。",
    "后来不知道怎么，她就成了那个照顾我的人。我生病，她半夜送药；我挂科，她帮我复盘；我每一件拿不准的事，第一个想商量的，都是她。",
  ]},
  { type:"text", tag:"", lines:[
    "这些年，她在我这儿，像姐姐，又比姐姐近。",
    "我大一那年，跟室友处不来，天天躲图书馆躲到半夜。有次她来找我，看我脸色不对，说：“搬来我这儿住吧。反正我一个人，空着一间房。”",
    "一开始是“暂住几天”。后来就成了“住几年”。她租的房子，我住了好几年。谁都没再提，这到底算什么。",
    "我们之间到底是什么关系，谁都没提过。不是不想，是不敢。有些话，一说出口，就得面对未来；而未来，谁都给不了谁。",
  ]},
  { type:"text", tag:"", lines:[
    "她只做一件事：记得我的口味。",
    "奶茶三分糖，去冰。咖啡不加奶。她比我自己还清楚。有次我随口说想喝新出的那款，第二天，那杯就出现在我桌上，三分糖，去冰。",
    "有回我发烧，迷迷糊糊睡了一天。醒来，床头放着一杯温水，和一碗白粥。粥是我爱喝的那家，她大老远买回来的。她自己，一口没吃。",
    "年审季，她回来得越来越晚。床头总有一盏她留的灯，和一杯晾好的温水。有时我靠那盏灯，才知道她回来过。",
  ]},
  { type:"choice", p:"凌晨，你听见她轻手轻脚进门。",
    o:[["装睡，没出声","-","她换了鞋，水都没喝，就进了房间。"],["起来，给她热了杯牛奶","沈宁+","她抬头看你，眼睛里有雾气：“谢谢。”声音很轻。"],["翻个身，把被子拉过头顶","沈宁-","她动作顿了一下，放得更轻了。"]]},
  { type:"text", tag:"", lines:[
    "有回她加班回来，饭都没吃，就靠在沙发上睡着了。台灯还开着，照着她的脸，眉头轻轻皱着。",
    "我去拿了件外套，轻轻盖在她身上。她动了动，没醒。我在旁边坐了一会儿，忽然觉得，这样，也挺好。",
  ]},
  { type:"text", tag:"", lines:[
    "夏晴下课晃进来，头发染得很浅，指甲油是新做的。她一进来，前两排的人，头都不自觉地往她这边偏。",
    "那家菠萝油店在巷子深处，只有两张桌子。她掰开菠萝油，多的那半推给我。",
    "“你对我这么好，我拿什么还你？”我侧头看她，“要不，我给你当一辈子狗。”",
  ]},
  { type:"text", tag:"", lines:[
    "她停住手，脸上一丝表情没有，用一种念新闻的调子：“新中国没有奴隶。”",
    "我还没反应过来，她接着念：“旧社会把人变成鬼，新社会把鬼变成人。”",
    "顿了顿，她拍拍我的肩：“同志，你这个觉悟，要提高。”我笑出来。她别过脸去，耳朵尖慢慢红了。",
  ]},
  { type:"choice", p:"她扫一眼你手机：“你又在刷这个。走走走，吃新开的菠萝油，我请。”",
    o:[["“行，不过我想安生吃顿饭。”","夏晴+","她笑了一下，不是营业那种：“行，就陪你。”"],["“好啊。”然后一整天跟着她夸她","夏晴-","她笑着，眼神却飘向了别处。"],["“不了，没胃口。”","-","她“哦”了一声，转身找别人去了。"]]},

  { type:"text", tag:"11月 · 各自的现实", lines:[
    "有次，我听见沈宁在阳台打电话。声音压得很低。",
    "“妈，我知道了……今年过年，我会回去的。”“那个男的，我见一面就是了。”",
    "她挂了电话，在阳台上站了很久。那天风大，她的衬衫被吹得鼓起来，像一只想飞又飞不起来的鸟。",
    "她妈后来不只是电话，直接杀到了这座城市。“都三十了，再不嫁，就真的没人要了。”她妈说。沈宁坐在那儿，一句话没说。",
  ]},
  { type:"choice", p:"她回到客厅，眼睛有点红。",
    o:[["“你妈又催你了？”你问","沈宁+","她愣了一下，“嗯”了一声：“让我过年回去，见一个人。”"],["装没看见，继续刷手机","-","她没说话，自己去了洗手间，水声哗哗响。"],["岔开话题，问她吃没吃","沈宁-","她顺着说了两句，就没再提。"]]},
  { type:"text", tag:"场景", lines:[
    "有天晚上，我去她那儿。电视里放着老电影，黑白的，屋里只开一盏台灯。",
    "电影放到一半，她忽然靠过来，把头枕在我肩上。她的头发蹭着我的脸，有股淡淡的洗发水味。",
    "过了很久，她伸手，环住了我的腰。很轻，像怕把我弄碎。",
    "她的体温，隔着衬衫，一点一点传过来。那一刻我忽然想，这些年，我们之间，到底算什么呢。",
  ]},
  { type:"choice", p:"她环着你腰的手，有点凉。",
    o:[["反手，覆在她手背上，慢慢扣住","沈宁+","她身体僵了一下，然后，慢慢放松下来。"],["僵着，一动没敢动","-","她的手，过了一会儿，收了回去。"],["假装睡着了","沈宁-","她以为你睡了，轻轻叹了口气。"]]},
  { type:"text", tag:"", lines:[
    "有回，我跟夏晴去食堂。她一路跟人打招呼，这个递包纸巾，那个问句“你妈病好点没”。",
    "我忽然发现，她记得所有人的事。谁失恋了，谁家有事，谁最近烦什么，她都记得。可她自己的事，从没跟任何人提过。",
    "后来我才知道，她做的“圈子”，说白了是信息差的生意。",
    "谁想找实习，她认识几个 HR，把人推过去，成了，收一笔介绍费。谁想进个圈子，她组个饭局，一人收几百，一桌十几个人，她能抽走小一半。谁想认识谁，她当中间人，两边的好处，都落她口袋里一点。",
    "她从中抽的，不多，可积少成多，够她自己用。“我不是爱热闹。”她说，“我是发现，有用的人，才不会被丢下。”",
  ]},
  { type:"text", tag:"", lines:[
    "她生日那天，没有一个人记得。连她爸妈，都忘了。",
    "我买了个小蛋糕，插了根蜡烛。她看着那根蜡烛，眼睛慢慢红了。“你是第一个。”她说，“给我过生日的人。”",
    "夏晴这几天，气色不好。有回下课，我听见她在楼梯间打电话，跟她爸吵。",
    "“我不去公司！我的人生，凭什么你们安排！”“联姻？都什么年代了，还搞这套！”",
  ]},
  { type:"text", tag:"", lines:[
    "她家做建材生意，早几年赚了钱。她爸给她安排的，是合作方的儿子。两家门当户对，联姻就是双赢。",
    "“他们连面都没让我见。”她笑，“就先谈好了彩礼和股份。我像个东西，被他们标好了价。”",
    "她挂了电话，一抬头看见我，又立刻笑开了：“嗨，姐姐。”那个笑，转得太快，快得有点假，像一张面具啪地扣回脸上。",
  ]},
  { type:"choice", p:"她笑得跟没事人一样。",
    o:[["“你刚才……没事吧？”你问","夏晴+","她笑容垮了一下，又撑起来：“没事，家里那点破事。”"],["也笑一下，什么都没问","-","她松了口气，说：“走吧，吃菠萝油。”"],["“别演了。”你直接说","夏晴-","她愣住，笑容一点点收了：“……很假吗？”"]]},

  { type:"text", tag:"12月 · 小安", lines:[
    "12月的晚上，我鬼使神差，拐进后门那条街。那家店在地下，要下几级台阶。门口一串灯，坏了几颗，一闪一闪。",
    "她就在吧台边。短发，衬衫解开两颗扣子，一条胳膊搭在吧台上，指间懒懒地转着个空杯子。",
    "她忙进忙出，谁叫她，她都笑着过去。倒酒，递骰子，陪人说话，动作利落得像条鱼。她的笑是练出来的，笑得好看，眼底却没一点温度。",
  ]},
  { type:"text", tag:"", lines:[
    "晚一点的时候，她会上台。不是唱歌，是跳舞。灯光打下来，她卡在卡座边上，扭着，跳着，帅得全场都在看她。",
    "有人喊她，她回头，冲我这边笑了一下。那笑很亮，也很坏，像她早就知道你会看她。",
  ]},
  { type:"choice", p:"你一下没移开眼。",
    o:[["点一杯酒，坐到一个她看得见的位置","小安+","她朝你这边看了一眼，嘴角勾了勾。"],["上前搭话：“你常来？”","小安-","她笑得敷衍：“嗯，常来。”"],["转身走了","-","你身后，那束光，暗了下去。"]]},
  { type:"text", tag:"场景", lines:[
    "中场休息，她下台卖酒。有人借着酒劲，把一杯酒往我面前推：“妹妹，喝一杯。”",
    "小安过来了，往我身前一挡，把我护在身后。我只看得到她的后颈，和后颈上那一小撮没扎进去的头发。",
    "“她不喝酒。”她笑着，仰头把那杯一口干了，“这杯，我替她。”",
    "那人还不依，伸手去拉她。她不动声色地侧身，躲开那只手，端起杯子碰了一下对方的：“我敬您。”一杯见底，她把空杯一亮，笑得职业：“您慢用。”",
  ]},
  { type:"choice", p:"她替你挡了那杯酒，回头看你。",
    o:[["拉住她手腕：“别喝了。”","小安+","她回头看你，眼睛亮了一下，又别开：“……你管我。”"],["“我自己能喝。”","-","她挑挑眉：“行，那你喝。”把酒杯推回来。"],["站在她身后，没说话","小安-","她没回头，继续招呼下一桌。"]]},
  { type:"text", tag:"", lines:[
    "后来我才知道，她这行有专门的叫法。可她从不让我用那个词。",
    "“我白天是学生，晚上是打工的。”她说，“就这么简单。”她白天在琴房练琴，晚上在夜场讨生活。钢琴，她弹了二十年。",
    "有次，我盯着她的手看。她发现了，把手在我眼前晃了晃：“看什么？”“你的手，很好看。”她愣了一下，把手缩回去，别开脸：“……有什么好看的。”",
  ]},
  { type:"text", tag:"", lines:[
    "有次她喝多了，跟我说：“你知道我最恨什么吗？”",
    "“我最恨他们装。表面是恩爱的爸妈，背地里，一个外面有家，一个外面有情人。”",
    "“私生子都好几个。可他们在饭桌上，还能笑着给我夹菜。”",
  ]},
  { type:"text", tag:"场景", lines:[
    "打烊已经是三点多，宿舍早关了门。她看了我一眼：“去我那儿吧。”",
    "我跟着她，拐进一条窄巷子，上了她租的出租屋。屋里很小，一张床，一张桌子，桌上摊着几本书，页角都翻卷了。",
    "靠墙放着一架电子琴，旧得发黄，是十年前的老款。",
    "“我从家里什么都没带走，就带了这个。”她说。",
  ]},
  { type:"text", tag:"", lines:[
    "她按下开关。音响里传出一阵细小的电流声，像雪，又像灰尘。",
    "然后，她弹起来。还是莫扎特，C大调第二十一钢琴协奏曲，第二乐章。手指在琴键上，稳得不像一个在夜场讨生活的人。",
    "电流声偶尔冒出来。可她弹得投入，闭着眼，身体轻轻晃着。",
    "我后来才从她手机里，翻到一张照片。照片里是个穿礼服的小女孩，坐在一架巨大的三角钢琴前，灯光打下来，台下乌压压坐满了人。",
    "“十岁的独奏会。”她说，“那架琴，现在还在我家。可惜，我回不去了。”",
    "我站在那儿，忽然觉得，这间逼仄的出租屋，被那点琴声，填得暖暖的。",
  ]},
  { type:"text", tag:"", lines:[
    "她从抽屉里翻出一只耳机，塞给我。“你睡床。”她说，“我睡地上。”",
    "“喂。”黑暗里，她忽然说，“以后，别一个人来这种地方。”",
    "第二天早上，我醒来，她已经不在。桌上放着一份早餐，还温的，旁边压着张纸条：我先去上课了。纸条下面，压着昨天那只耳机。",
  ]},

  { type:"text", tag:"1月 · 过年", lines:[
    "我是北方人，山河四省出来的。老家是那种县，跟衡水一个模子。五点半起床，跑着去吃饭，五分钟吃完，再跑回教室。卷子按分数排座位，最后一名坐垃圾桶旁边。",
    "我一路考出来，考进了南方这座临海的小城。这里年轻，人人都是外地人，没人问你“上岸了没”。",
    "回家过年。饭桌上热气腾腾，妈夹了块鱼到我碗里。",
    "“毕业了，工作定了没？”妈问。“隔壁你李姨家的闺女，考了编，多好，铁饭碗。”妈叹口气，“你也别挑。”",
    "爸没说话，闷头喝酒。妈又补一句：“对象呢？也抓紧点。”我低头扒饭。有些话，我这辈子都没法说出口。",
  ]},
  { type:"choice", p:"妈催对象，你怎么回？",
    o:[["岔开话，问家里近况","夏晴+","妈顺着你聊起了家常，没再提对象。"],["沉默，把碗放下说“吃饱了”","-","饭桌上静了几秒，爸又给自己倒了杯酒。"],["“我不着急。”","小安-","妈叹口气：“不急，能不急吗。”"]]},
  { type:"text", tag:"", lines:[

    "四月的天，已经很暖了。可我们三个人的日子，却一天比一天冷。沈宁要走，夏晴没家可回，小安跟家里彻底断了。",

let i = 0;
const stage = document.getElementById('stage');

function el(h){ stage.innerHTML = h; }
function next(){ i++; render(); }

function render(){
  if(i >= FLOW.length){ ending(); return; }
  const n = FLOW[i];
  if(n.type === "text"){
    el(`<div class="title-bar">岸</div><div class="scene-tag">${n.tag}</div><div class="text">${n.lines.map(l=>`<p>${l}</p>`).join('')}</div><div class="click-hint">▸ 点击继续</div>`);
    stage.onclick = next;
  } else if(n.type === "choice"){
    el(`<div class="title-bar">岸</div><div class="text"><p>${n.p}</p></div><div class="choices">${n.o.map((o,idx)=>`<button class="choice" data-i="${idx}">${o[0]}</button>`).join('')}</div>`);
    stage.onclick = null;
    stage.querySelectorAll('.choice').forEach(b => b.onclick = (e)=>{
      e.stopPropagation();
      const opt = n.o[+b.dataset.i];
      const v = opt[1];
      if(v.endsWith("+")) scores[v.slice(0,-1)]++;
      else if(v.endsWith("-") && v !== "-") scores[v.slice(0,-1)]--;
      if(opt[2]){
        el(`<div class="title-bar">岸</div><div class="text"><p>${opt[2]}</p></div><div class="click-hint">▸ 点击继续</div>`);
        stage.onclick = next;
      } else { next(); }
    });
  }
}

function ending(){
  const entries = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const top = entries[0];
  const name = top[1] > 0 ? top[0] : null;
  const txt = {
    "沈宁":"她帮了我，内推进一家单位。朝九晚五，月薪五千。\n\n我们住到一起。后来，我们不再相拥入眠了。床很大，各睡一边，中间那道缝，谁也跨不过去。\n\n不是不爱了。是爱还在，可“恋人”那个位置，空了。现在躺在我旁边的，是我的亲人，不是我的恋人。\n\n一切都挺好的。工作挺好，她也挺好，日子挺好。“挺好”这两个字，最磨人。叔本华说，人像钟摆，在痛苦和无聊之间摆。我摆到了无聊这一头。不疼，就是空。\n\n偶尔，我会想起那些年，她留的灯，晾好的温水，和那杯永远三分糖去冰的奶茶。它们还在。只是，我们都变了。\n\n有时我看着她，会想起很多年前，那个安静地听、安静地笑的姑娘。她还在。只是我们都学会了，把话咽下去。",
    "夏晴":"她拉我进了她的圈子和生意。我热闹起来了，认识的人比前二十年加起来还多。\n\n可她的占有欲，一天比一天缠人。回消息慢了，她要问；跟别人吃饭，她要问；半夜我翻个身，她会惊醒，一把抓住我的手腕：“你要去哪？”\n\n她太怕失去了。怕到要把我攥在手心里，攥到骨头发白。我成了她的安全物。不是恋人，是那个“证明我不会被丢下”的物件。\n\n像太阳，太近了，会把人烤干。可我不敢走。我怕我一走，她那个洞，就真的没人填了。\n\n我有时会想，如果当初没进她的圈子，我的人生会不会轻松一点。可每次这么想，又觉得，没有她那个热闹，我可能连“轻松”是什么，都不知道。",
    "小安":"我跟她一起，不将就了。\n\n她跟家里断了联系，边读书边打工。两个人在外地合租一间房。她白天上课，晚上驻唱；我白天上班，晚上写东西。\n\n钱是紧的。房租一交，剩下的掰着花。可谁都不说苦，谁先说了，就好像认输了。\n\n有回夜里醒来，看见她趴在桌上睡着了，手里还攥着半截笔，台灯没关。她梦里皱着眉。\n\n我们谁都不知道，这口气能撑到哪一天。但至少，现在，我们都没低头。\n\n她常说，等毕了业，靠这双手，日子就好了。我信。可我也知道，这之前，还有很长的夜路要走。",
    "none":"毕业那年，我考了编。分数不高不低，刚好够上一个外地大专的岗位。\n\n一个月四千。房租、水电、吃饭，紧巴巴，攒不下钱，也死不了。\n\n“铁饭碗”这三个字，我以前不懂。现在懂了。铁是铁的，就是太铁了，把你焊死在这儿，动不了。\n\n办公室很小，同事聊孩子、聊房子、聊“你们年轻人就是不肯吃苦”。我插不上话。一眼看到头。四十岁的样子，跟现在一模一样。\n\n有回翻到同学群，看他们有的去了大厂，有的出了国，有的还在漂。我默默把手机扣过去。我什么都有了吗？我有个铁饭碗。可这碗里盛的是不是我要的饭，我到现在，也没想明白。\n\n我考编，是因为妈说“稳定就是最大的孝顺”。后来我懂了，稳定是真的，可“看到头”，也是真的。",
  };
  const key = name || "none";
  const tagMap = { "沈宁":"今天 · 沈宁", "夏晴":"今天 · 夏晴", "小安":"今天 · 小安", "none":"谁都没选" };
  const h2Map = { "沈宁":"你靠近了她", "夏晴":"你靠近了她", "小安":"你靠近了她", "none":"一年，什么都没发生" };
  el(`<div class="ending"><div class="tag">${tagMap[key]}</div><h2>${h2Map[key]}</h2><div class="body">${txt[key]}</div><button class="restart">重新开始</button></div>`);
  stage.onclick = null;
  stage.querySelector('.restart').onclick = () => location.reload();
}

// ===== 阴翳 BGM（Web Audio 合成）=====
let bgmCtx = null, bgmOn = false, bgmMaster = null, bgmStep = 0;
const bgmNotes = [220.00, 261.63, 329.63, 440.00, 329.63, 261.63];

function bgmNote(freq, when, dur){
  const o = bgmCtx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const g = bgmCtx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.22, when + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bgmMaster); o.start(when); o.stop(when + dur + 0.05);
  const o2 = bgmCtx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = freq * 0.5;
  const g2 = bgmCtx.createGain();
  g2.gain.setValueAtTime(0.0001, when);
  g2.gain.exponentialRampToValueAtTime(0.10, when + 0.05);
  g2.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.6);
  o2.connect(g2); g2.connect(bgmMaster); o2.start(when); o2.stop(when + dur * 0.6 + 0.05);
}
function bgmSchedule(){
  if(!bgmOn || !bgmCtx) return;
  bgmNote(bgmNotes[bgmStep % bgmNotes.length], bgmCtx.currentTime + 0.05, 1.8);
  bgmStep++;
  setTimeout(bgmSchedule, 1800);
}
function startBGM(){
  if(bgmCtx){ if(!bgmOn){ bgmMaster.gain.value = 0.4; bgmOn = true; bgmSchedule(); } return; }
  bgmCtx = new (window.AudioContext || window.webkitAudioContext)();
  bgmMaster = bgmCtx.createGain(); bgmMaster.gain.value = 0.4; bgmMaster.connect(bgmCtx.destination);
  const d1 = bgmCtx.createOscillator(); d1.type = 'sine'; d1.frequency.value = 110;
  const gd1 = bgmCtx.createGain(); gd1.gain.value = 0.05;
  d1.connect(gd1); gd1.connect(bgmMaster); d1.start();
  const d2 = bgmCtx.createOscillator(); d2.type = 'sine'; d2.frequency.value = 164.81;
  const gd2 = bgmCtx.createGain(); gd2.gain.value = 0.03;
  d2.connect(gd2); gd2.connect(bgmMaster); d2.start();
  bgmOn = true; bgmSchedule();
}
function toggleBGM(){
  if(!bgmCtx){ startBGM(); }
  else if(bgmOn){ bgmMaster.gain.value = 0; bgmOn = false; }
  else { bgmMaster.gain.value = 0.4; bgmOn = true; bgmSchedule(); }
  document.getElementById('bgmBtn').textContent = bgmOn ? '🔊' : '🔇';
}
document.getElementById('bgmBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleBGM(); });
document.addEventListener('click', function once(){ if(!bgmOn) startBGM(); document.removeEventListener('click', once); });

render();
</script>
